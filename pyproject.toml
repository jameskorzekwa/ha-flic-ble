[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["custom_components/flic_ble/pyflic_ble", "tests/vendored_pyflic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
